<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Data Quizzes</title>
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  </head>
  <body>
    <header>
      <a href="#" id="home" data-i="title">Data Quizzes</a>
      <span
        ><button id="shuf"></button><button id="lang"></button
        ><button id="theme"></button
      ></span>
    </header>
    <main>
      <section id="hub">
        <p id="sub" data-i="subtitle"></p>
        <div id="grid"></div>
      </section>
      <section id="quiz" hidden>
        <div id="q" class="card"></div>
        <div id="view"></div>
        <div class="row">
          <input id="ans" autocomplete="off" /><button
            id="submit"
            data-i="submit"
          ></button>
        </div>
        <div id="fb"></div>
        <div class="row">
          <button id="show" data-i="show"></button
          ><button id="next" data-i="next"></button
          ><button id="rand" data-i="rand"></button>
        </div>
        <div class="row stats">
          <span id="score"></span><span id="last"></span
          ><span id="total"></span>
        </div>
      </section>
    </main>
    <footer>RendraKB-2025</footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
